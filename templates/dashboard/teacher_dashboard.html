{% extends 'models/base.html' %}

{% block content %}
<div class="content">
    <!-- Dashboard Cards -->
    <div class="dashboard-cards">
        <div class="card stat-card">
            <div class="stat-icon students-icon">
                <i class="fas fa-user-graduate"></i>
            </div>
            <div class="stat-info">
                <p>{{ student_count }} Elèves</p>
            </div>
        </div>
        <div class="card stat-card">
            <div class="stat-icon teachers-icon">
                <i class="fas fa-chalkboard-teacher"></i>
            </div>
            <div class="stat-info">
                <div class="stat-info">
                    <p>{{ teacher_count }} Enseignants</p>
                </div>
            </div>
        </div>
        <div class="card stat-card clickable-card" >
            <div class="stat-icon" style="background-color: #E91E63;">
                <i class="fas fa-lightbulb"></i>
            </div>
            <div class="stat-info">
                <p>{{ module_count }} Modules</p>

            </div>
        </div>
        <div class="card stat-card clickable-card"onclick="window.location.href='{% url 'dashboard:timetable_view' %}'">
            <div class="card-body">
                <div class="d-flex align-items-center">
                    <div class="stat-icon" style="background-color: #4CAF50;">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <div class="stat-info ml-3">
                        <p class="text-muted mb-0">Voir l'emploi du temps</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Graphique et infos-->
    <div class="charts">
        <div class="chart-container">
            <div class="chart-header">
                <h3>Statistiques des étudiants</h3>
                <i class="fas fa-ellipsis-v"></i>
            </div>
            <div class="chart-content">
                <!-- Placeholder for chart -->
                <div style="height: 300px; background-color: #f5f7fb; display: flex; justify-content: center; align-items: center; border-radius: 5px;">
                    <p>Graphique des statistiques des étudiants</p>
                </div>
            </div>
        </div>
        <div class="summary-container">
            <div class="summary-header">
                <h3>Informations Importantes</h3>
                <i class="fas fa-ellipsis-v"></i>
            </div>
            <div class="summary-content">
                <!-- Informations pour les enseignants -->
                <div class="info-section">
                    <div class="info-card-header">
                    </div>
                    <div class="info-card-body">
                        <div class="form-group">
                            <label for="teacher_info_title">Titre:</label>
                            <input type="text" class="form-control" id="teacher_info_title" value="Réunion pédagogique" readonly>
                        </div>
                        <div class="form-group">
                            <label for="teacher_info_content">Contenu:</label>
                            <textarea class="form-control" id="teacher_info_content" rows="6" readonly>Une réunion pédagogique est prévue le vendredi 10 juin à 16h00 en salle des professeurs. Ordre du jour: préparation des examens de fin de semestre.</textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    /* Styles généraux */
    .content {
        padding: 20px;
    }
    
    .page-title {
        margin-bottom: 30px;
    }
    
    .page-title h2 {
        color: #333;
        font-weight: 700;
    }
    
    /* Cartes de statistiques */
    .dashboard-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }
    
    .stat-card {
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        display: flex;
        align-items: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        border: none;
    }
    
    .stat-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }
    
    .stat-icon {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 15px;
        font-size: 24px;
        color: white;
    }
    
    .students-icon {
        background-color: #4e73df;
    }
    
    .teachers-icon {
        background-color: #1cc88a;
    }
    
    .stat-info p {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #333;
    }
    
    /* Graphique et résumé */
    .charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
    }
    
    @media (max-width: 992px) {
        .charts {
            grid-template-columns: 1fr;
        }
    }
    
    .chart-container, .summary-container {
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
    }
    
    .chart-header, .summary-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eee;
    }
    
    .chart-header h3, .summary-header h3 {
        margin: 0;
        color: #333;
        font-weight: 600;
    }
    
    .chart-content {
        height: 300px;
    }
    
    /* Cartes d'information */
    .info-section {
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 1px solid #eee;
    }
    
    .info-section:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
    }
    
    .info-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }
    
    .info-card-header h3 {
        margin: 0;
        color: #333;
        font-weight: 600;
    }
    
    .info-card-header > div {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .info-icon {
        font-size: 24px;
        color: #4e73df;
    }
    
    .btn-edit {
        background: none;
        border: none;
        color: #6c757d;
        cursor: pointer;
        font-size: 18px;
        transition: color 0.3s;
        padding: 5px;
        border-radius: 4px;
    }
    
    .btn-edit:hover {
        color: #4e73df;
        background-color: #f8f9fa;
    }
    
    .info-card-body {
        margin-top: 15px;
    }
    
    .form-group {
        margin-bottom: 15px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #333;
    }
    
    .form-control {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
        background-color: #f8f9fa;
        transition: all 0.3s;
    }
    
    .form-control:read-only {
        border-color: transparent;
        background-color: #f8f9fa;
    }
    
    .form-control:focus {
        outline: none;
        border-color: #4e73df;
        background-color: #fff;
        box-shadow: 0 0 0 3px rgba(78, 115, 223, 0.1);
    }
    
    textarea.form-control {
        min-height: 120px;
        resize: vertical;
    }
    
    .action-buttons {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 15px;
    }
    
    .btn-save, .btn-cancel, .btn-delete {
        padding: 8px 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
    }
    
    .btn-save {
        background-color: #4e73df;
        color: white;
    }
    
    .btn-save:hover {
        background-color: #3a5fc8;
    }
    
    .btn-cancel {
        background-color: #6c757d;
        color: white;
    }
    
    .btn-cancel:hover {
        background-color: #5a6268;
    }
    
    .btn-delete {
        background-color: #e74a3b;
        color: white;
    }
    
    .btn-delete:hover {
        background-color: #d52a1a;
    }
    
    /* Styles pour les cartes cliquables */
    .clickable-card {
        cursor: pointer;
        transition: transform 0.2s;
    }
    
    .clickable-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .timetable-container {
        overflow-x: auto;
        margin-top: 15px;
    }

    .timetable-table {
        width: 100%;
        border-collapse: collapse;
    }

    .timetable-table th, .timetable-table td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
    }

    .timetable-table th {
        background-color: #f5f7fb;
        font-weight: bold;
    }

    .timetable-table tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    .timetable-table tr:hover {
        background-color: #f1f1f1;
    }

    .disabled-cell {
        background-color: #f5f5f5;
        color: #999;
    }

    .modal-content {
        border-radius: 8px;
        border: none;
    }

    .modal-header {
        background-color: #f5f7fb;
        border-bottom: 1px solid #eaeaea;
        border-top-left-radius: 8px;
        border-top-right-radius: 8px;
    }

    .modal-footer {
        border-top: 1px solid #eaeaea;
    }
    
    .d-none {
        display: none;
    }
</style>

<script>
    // Stocker les valeurs originales pour l'annulation
    let originalValues = {};
    
    function toggleEdit(type) {
        const titleInput = document.getElementById(`${type}_info_title`);
        const contentTextarea = document.getElementById(`${type}_info_content`);
        const actionButtons = document.getElementById(`${type}_actions`);
        
        // Si on est en mode édition, sauvegarder les valeurs originales
        if (titleInput.readOnly) {
            originalValues[type] = {
                title: titleInput.value,
                content: contentTextarea.value
            };
            
            // Passer en mode édition
            titleInput.readOnly = false;
            contentTextarea.readOnly = false;
            actionButtons.classList.remove('d-none');
        } else {
            // Sinon, repasser en mode lecture
            titleInput.readOnly = true;
            contentTextarea.readOnly = true;
            actionButtons.classList.add('d-none');
        }
    }
    
    function saveInfo(type) {
        const titleInput = document.getElementById(`${type}_info_title`);
        const contentTextarea = document.getElementById(`${type}_info_content`);
        const actionButtons = document.getElementById(`${type}_actions`);
        
        // Récupération des valeurs
        const title = titleInput.value;
        const content = contentTextarea.value;
        
        // Validation simple
        if (!title.trim() || !content.trim()) {
            alert('Le titre et le contenu ne peuvent pas être vides!');
            return;
        }
        
        // Ici, vous pouvez ajouter le code pour sauvegarder les données
        console.log(`Enregistrement des informations ${type}:`, { title, content });
        
        // Afficher une alerte de succès
        alert('Informations enregistrées avec succès!');
        
        // Repasser en mode lecture
        titleInput.readOnly = true;
        contentTextarea.readOnly = true;
        actionButtons.classList.add('d-none');
        
        // Effacer les valeurs originales
        delete originalValues[type];
    }
    
    function cancelEdit(type) {
        const titleInput = document.getElementById(`${type}_info_title`);
        const contentTextarea = document.getElementById(`${type}_info_content`);
        const actionButtons = document.getElementById(`${type}_actions`);
        
        // Restaurer les valeurs originales si elles existent
        if (originalValues[type]) {
            titleInput.value = originalValues[type].title;
            contentTextarea.value = originalValues[type].content;
        }
        
        // Repasser en mode lecture
        titleInput.readOnly = true;
        contentTextarea.readOnly = true;
        actionButtons.classList.add('d-none');
        
        // Effacer les valeurs originales
        delete originalValues[type];
    }
    
    function deleteInfo(type) {
        if (confirm('Êtes-vous sûr de vouloir supprimer ces informations? Cette action est irréversible.')) {
            const titleInput = document.getElementById(`${type}_info_title`);
            const contentTextarea = document.getElementById(`${type}_info_content`);
            const actionButtons = document.getElementById(`${type}_actions`);
            
            // Ici, vous pouvez ajouter le code pour supprimer les données
            console.log(`Suppression des informations ${type}`);
            
            // Réinitialiser les champs
            titleInput.value = '';
            contentTextarea.value = '';
            
            // Repasser en mode lecture
            titleInput.readOnly = true;
            contentTextarea.readOnly = true;
            actionButtons.classList.add('d-none');
            
            // Afficher une alerte de succès
            alert('Informations supprimées avec succès!');
            
            // Effacer les valeurs originales
            delete originalValues[type];
        }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        // Simulation du chargement des étudiants lorsqu'une classe est sélectionnée
        const classSelect = document.getElementById('class_select');
        if (classSelect) {
            classSelect.addEventListener('change', function() {
                const classId = this.value;
                
                // Ajouter des options fictives selon la classe sélectionnée
                let options = '<option value="">-- Sélectionner un étudiant --</option>';
                
                if (classId === '1') {
                    options += '<option value="1">Jean Dupont</option>';
                    options += '<option value="2">Marie Lambert</option>';
                    options += '<option value="3">Thomas Martin</option>';
                } else if (classId === '2') {
                    options += '<option value="4">Sophie Dubois</option>';
                    options += '<option value="5">Pierre Leroy</option>';
                    options += '<option value="6">Julie Moreau</option>';
                } else if (classId === '3') {
                    options += '<option value="7">Lucie Bernard</option>';
                    options += '<option value="8">Hugo Petit</option>';
                    options += '<option value="9">Emma Garcia</option>';
                } else if (classId === '4') {
                    options += '<option value="10">Léo Durand</option>';
                    options += '<option value="11">Chloé Roux</option>';
                    options += '<option value="12">Mathieu Vincent</option>';
                }
                
                // Mettre à jour le sélecteur d'étudiants (si présent dans votre HTML)
                const studentSelect = document.getElementById('student_select');
                if (studentSelect) {
                    studentSelect.innerHTML = options;
                }
            });
        }
    });
</script>
{% endblock %}
