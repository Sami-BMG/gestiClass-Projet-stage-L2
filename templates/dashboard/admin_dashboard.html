{% extends 'models/base.html' %}

{% block content %}
<div class="content">
    <div class="page-title">
        <h2>Tableau de Bord Admin</h2>
    </div>

    <!-- Dashboard Cards -->
    <div class="dashboard-cards">
        <div class="card stat-card">
            <div class="stat-icon students-icon">
                <i class="fas fa-user-graduate"></i>
            </div>
            <div class="stat-info">
                <p>{{ student_count }} Elèves</p>
            </div>
        </div>
        <div class="card stat-card">
            <div class="stat-icon teachers-icon">
                <i class="fas fa-chalkboard-teacher"></i>
            </div>
            <div class="stat-info">
                <div class="stat-info">
                    <p>{{ teacher_count }} Enseignants</p>
                </div>
            </div>
        </div>
        <div class="card stat-card clickable-card"
        onclick="window.location.href='{% url 'dashboard:timetable_view' %}'">

            <div class="card-body">
                <div class="d-flex align-items-center">
                    <div class="stat-icon" style="background-color: #4CAF50;">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <div class="stat-info ml-3">
                        <h5 class="mb-1">Emploi du temps</h5>
                        <p class="text-muted mb-0">Gestion des plannings</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="card stat-card clickable-card" onclick="window.location.href='{% url 'dashboard:suggestions_list' %}'">
            <div class="stat-icon" style="background-color: #E91E63;">
                <i class="fas fa-lightbulb"></i>
            </div>
            <div class="stat-info">
                <p>{{ new_contacts_count }} Suggestions</p>

            </div>
        </div>
    </div>


</div>

<!-- Modal pour les informations étudiants -->
<div class="modal fade" id="studentInfoModal" tabindex="-1" role="dialog" aria-labelledby="studentInfoModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="studentInfoModalLabel">Informations pour les étudiants</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="student_info_title">Titre:</label>
                    <input type="text" class="form-control" id="student_info_title" value="Examen de fin de semestre">
                </div>
                <div class="form-group">
                    <label for="student_info_content">Contenu:</label>
                    <textarea class="form-control" id="student_info_content" rows="6">Les examens de fin de semestre auront lieu du 15 au 20 juin. Veuillez consulter le calendrier pour plus de détails sur les horaires et les salles.</textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
                <button type="button" class="btn btn-primary">Enregistrer</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal pour les informations enseignants -->
<div class="modal fade" id="teacherInfoModal" tabindex="-1" role="dialog" aria-labelledby="teacherInfoModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="teacherInfoModalLabel">Informations pour les enseignants</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="teacher_info_title">Titre:</label>
                    <input type="text" class="form-control" id="teacher_info_title" value="Réunion pédagogique">
                </div>
                <div class="form-group">
                    <label for="teacher_info_content">Contenu:</label>
                    <textarea class="form-control" id="teacher_info_content" rows="6">Une réunion pédagogique est prévue le vendredi 10 juin à 16h00 en salle des professeurs. Ordre du jour: préparation des examens de fin de semestre.</textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
                <button type="button" class="btn btn-primary">Enregistrer</button>
            </div>
        </div>
    </div>
</div>



<style>
.clickable-card {
    cursor: pointer;
    transition: transform 0.2s;
}

.clickable-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.timetable-container {
    overflow-x: auto;
    margin-top: 15px;
}

.timetable-table {
    width: 100%;
    border-collapse: collapse;
}

.timetable-table th, .timetable-table td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
}

.timetable-table th {
    background-color: #f5f7fb;
    font-weight: bold;
}

.timetable-table tr:nth-child(even) {
    background-color: #f9f9f9;
}

.timetable-table tr:hover {
    background-color: #f1f1f1;
}

.disabled-cell {
    background-color: #f5f5f5;
    color: #999;
}

.modal-content {
    border-radius: 8px;
    border: none;
}

.modal-header {
    background-color: #f5f7fb;
    border-bottom: 1px solid #eaeaea;
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
}

.modal-footer {
    border-top: 1px solid #eaeaea;
}


</style>

{% endblock %}
